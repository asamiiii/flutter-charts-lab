name: Flutter checks and builds
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --base-href /flutter-charts-lab/
      - uses: actions/upload-artifact@v4
        with:
          name: web-preview
          path: build/web
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: android-demo-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
